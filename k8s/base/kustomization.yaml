apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skipan
# The Namespace itself is cluster-scoped and deliberately not part of this base —
# create it explicitly (`ws k8s create namespace skipan`) so the namespace-scoped
# guard can authorize the apply.
resources:
- serviceaccount.yaml
- configmap.yaml
- deployment.yaml
- service.yaml
- httproute.yaml
